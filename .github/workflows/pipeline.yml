name: Macroeconomic Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: macroeconomic-pipeline
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Run pipeline
        run: make run

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macroeconomic-pipeline-output
          path: |
            data/bronze/
            data/silver/
          if-no-files-found: warn
          retention-days: 7
